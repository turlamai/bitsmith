# Flatpak bundle manifest for the release payload (family policy: the
# Linux distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# CI renders the __VERSION__ / __ARCH__ / __SHA256__ placeholders from the
# linux tar.gz it just built and writes the generated manifest to the repo
# root (see .github/workflows/release.yml, the Flatpak step):
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.bitsmith.yml > site.jrtx.bitsmith.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir site.jrtx.bitsmith.gen.yml
#   flatpak build-bundle repo bitsmith-<v>-linux-<arch>.flatpak site.jrtx.bitsmith
#
# The payload is self-contained (embedded Racket CS runtime under lib/,
# the frontend under public/). Dependency closure vs the GNOME Platform
# runtime, per the termpilot/hackdigest glaze-payload evidence: the
# launcher and racketcs runtime need exactly glibc + libz.so.1 (all in
# the runtime) — no extra modules. glaze's webview dlopens gtk-3 and
# webkit2gtk-4.1 (the GNOME runtime hosts Epiphany, so both ship there),
# and the updater's crypto package FFI-loads libssl.so.3 / libcrypto.so.3
# (OpenSSL 3 is part of the GNOME runtime since 48). The update check
# needs the network permission below.
app-id: site.jrtx.bitsmith
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: Bitsmith
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # glaze's prefer_xwayland_backend() picks X11 exactly when DISPLAY is
  # set and WAYLAND_DISPLAY is not; granting only the X11 socket keeps
  # that decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # The update check leaves the sandbox; nothing else talks to a network.
  - --share=network
modules:
  - name: bitsmith
    buildsystem: simple
    build-options:
      # The payload's launcher (bin/Bitsmith) carries the whole program in
      # a non-alloc ELF section (.rackprog). flatpak-builder's debuginfo
      # extraction (on by default) strips those files, which drops
      # non-alloc sections: the launcher dies at startup (termpilot
      # evidence, same racketcs payload shape). The payload ships
      # prebuilt — keep it byte-exact.
      no-debuginfo: true
    sources:
      - type: archive
        # The release tarball is flat (bin/, lib/ at the root, no leading
        # top-level directory); flatpak-builder's default
        # strip-components=1 strips the FIRST path component off every
        # entry. Keep the layout exactly as packaged.
        strip-components: 0
        path: bitsmith-__VERSION__-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: assets/icon-512.png
      - type: file
        path: flatpak/site.jrtx.bitsmith.desktop
    build-commands:
      # flatpak-builder strips the archive's leading directory: the
      # payload (bin/, lib/) lands flat in the build dir.
      - mkdir -p /app/bitsmith
      - cp -a bin lib /app/bitsmith/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A wrapper execs the real binary, so
      # /proc/self/exe still resolves to it (runtime layout discovery
      # keeps working). The wrapper also pins the config dir into the
      # flatpak per-app writable dir (~/.var/app/<app-id>/config) — /app
      # is mounted read-only in the sandbox.
      - mkdir -p /app/bin
      - |
        cat > /app/bin/Bitsmith <<'EOF'
        #!/bin/sh
        : "${BITSMITH_DATA_DIR:=${XDG_CONFIG_HOME:-$HOME/.config}/bitsmith}"
        export BITSMITH_DATA_DIR
        exec /app/bitsmith/bin/Bitsmith
        EOF
        chmod +x /app/bin/Bitsmith
      - install -Dm644 icon-512.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.bitsmith.png
      - install -Dm644 site.jrtx.bitsmith.desktop
                    /app/share/applications/site.jrtx.bitsmith.desktop
