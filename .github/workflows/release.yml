name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release pipeline per tag at a time; never cancel a publishing run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Build provenance attestations for the published payloads.
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION, engine app-version, and CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: skipping tag validation, building from VERSION"
            exit 0
          fi
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      # Fail-closed like termpilot/hackdigest: the signed update feed is
      # part of the release contract, so a missing secret must stop the
      # release before the expensive builds run, not after.
      - name: Require Ed25519 update signing secret before packaging
        if: github.event_name == 'push'
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release before expensive builds"
            exit 1
          fi

  linux:
    name: Linux package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(cat VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: Bogdanp/setup-racket@v1.15
        with:
          # Each leg builds the architecture it will package (family
          # convention, macos leg pattern).
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#v0.19.0

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      # The installer toolchains glaze degrades across: dpkg-deb is stock
      # on ubuntu runners, rpmbuild comes from apt, appimagetool ships as
      # an AppImage (run with APPIMAGE_EXTRACT_AND_RUN=1 — no FUSE on CI),
      # downloaded per runner architecture.
      - name: Install packaging toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          case "${{ matrix.arch }}" in
            x64)   TOOLARCH="x86_64" ;;
            arm64) TOOLARCH="aarch64" ;;
          esac
          curl -sL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOLARCH}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Package
        run: |
          # --installer runs glaze's native installer chain (it silently
          # degrades to tar.gz without toolchains — the test -f gates
          # below turn that into a hard failure). glaze stamps the native
          # architecture into deb (Architecture: arm64/amd64), rpm
          # (BuildArch) and the AppImage payload.
          raco glaze build \
            --entry main.rkt \
            --name Bitsmith \
            --version "$VERSION" \
            --installer \
            --out dist
          # glaze emits Bitsmith.{deb,rpm,AppImage} (app-name case, no
          # version); rename to the family asset form.
          test -f dist/Bitsmith.deb
          test -f dist/Bitsmith.rpm
          test -f dist/Bitsmith.AppImage
          mv dist/Bitsmith.deb      "bitsmith-$VERSION-linux-${{ matrix.arch }}.deb"
          mv dist/Bitsmith.rpm      "bitsmith-$VERSION-linux-${{ matrix.arch }}.rpm"
          mv dist/Bitsmith.AppImage "bitsmith-$VERSION-linux-${{ matrix.arch }}.AppImage"

      - name: Tarball (the portable runtime, installers excluded)
        run: |
          (cd dist && tar czf "../bitsmith-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
            $(ls | grep -v -E '\.(sha256|deb|rpm|AppImage)$'))

      # Flatpak bundle from the tarball built above (the Linux
      # distribution contract's last format). The manifest template
      # declares the exact dependency closure against the GNOME 50
      # runtime (termpilot/hackdigest glaze-payload evidence — no extra
      # modules).
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-built payload. The bundle inherits the runner arch.
          case "${{ matrix.arch }}" in
            x64)   FPARCH="x86_64" ;;
            arm64) FPARCH="aarch64" ;;
          esac
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release. The
          # tarball sits at the repo root ("Tarball" above).
          tarball="bitsmith-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -s "$tarball"
          SHA="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${{ matrix.arch }}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.bitsmith.yml > site.jrtx.bitsmith.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.bitsmith.gen.yml
          flatpak build-bundle flatpak-repo \
            "bitsmith-$VERSION-linux-${{ matrix.arch }}.flatpak" site.jrtx.bitsmith stable
          rm -rf flatpak-build flatpak-repo site.jrtx.bitsmith.gen.yml
          test -f "bitsmith-$VERSION-linux-${{ matrix.arch }}.flatpak"

      - name: Per-asset .sha256 sidecars
        run: |
          for f in bitsmith-$VERSION-linux-${{ matrix.arch }}.tar.gz \
                   bitsmith-$VERSION-linux-${{ matrix.arch }}.deb \
                   bitsmith-$VERSION-linux-${{ matrix.arch }}.rpm \
                   bitsmith-$VERSION-linux-${{ matrix.arch }}.AppImage \
                   bitsmith-$VERSION-linux-${{ matrix.arch }}.flatpak; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            bitsmith-*-linux-${{ matrix.arch }}.tar.gz
            bitsmith-*-linux-${{ matrix.arch }}.tar.gz.sha256
            bitsmith-*-linux-${{ matrix.arch }}.deb
            bitsmith-*-linux-${{ matrix.arch }}.deb.sha256
            bitsmith-*-linux-${{ matrix.arch }}.rpm
            bitsmith-*-linux-${{ matrix.arch }}.rpm.sha256
            bitsmith-*-linux-${{ matrix.arch }}.AppImage
            bitsmith-*-linux-${{ matrix.arch }}.AppImage.sha256
            bitsmith-*-linux-${{ matrix.arch }}.flatpak
            bitsmith-*-linux-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(cat VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#v0.19.0

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: App icon (icns from icon-512.png)
        run: |
          ICONSET=dist/icon.iconset
          mkdir -p "$ICONSET"
          for spec in 16 32 128 256 512; do
            sips -z $spec $spec assets/icon-512.png --out "$ICONSET/icon_${spec}x${spec}.png" >/dev/null
            dbl=$((spec * 2))
            sips -z $dbl $dbl assets/icon-512.png --out "$ICONSET/icon_${spec}x${spec}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/Bitsmith.icns
          rm -rf "$ICONSET"

      - name: Package app bundle
        run: |
          # Ad-hoc signed (no Developer ID yet — the Apple-signing rollout
          # is a separate family workstream; same state as termpilot 0.9.0).
          raco glaze build \
            --entry main.rkt \
            --name Bitsmith \
            --version "$VERSION" \
            --icon dist/Bitsmith.icns \
            --sign - \
            --out dist

      - name: Inject app icon (raco exe --icns does not reach the .app wrapper)
        run: |
          APP=dist/Bitsmith.app
          cp dist/Bitsmith.icns "$APP/Contents/Resources/Bitsmith.icns"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Bitsmith" "$APP/Contents/Info.plist"
          # Re-sign ad-hoc: the Resources copy invalidated the previous seal.
          codesign --force --deep --sign - "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/Bitsmith.icns"

      - name: Portable zip (.app at the archive root)
        run: |
          (cd dist && zip -qry "../bitsmith-$VERSION-macos-${{ matrix.arch }}.zip" Bitsmith.app)

      - name: DMG (drag to Applications)
        run: |
          set -euo pipefail
          dmg="bitsmith-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/Bitsmith.app "$staging/"
          ln -s /Applications "$staging/Applications"
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname Bitsmith -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"; break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }

      - name: Per-asset .sha256 sidecars
        run: |
          for f in bitsmith-$VERSION-macos-${{ matrix.arch }}.zip bitsmith-$VERSION-macos-${{ matrix.arch }}.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            bitsmith-*-macos-*.zip
            bitsmith-*-macos-*.dmg
            bitsmith-*-macos-*.sha256
          if-no-files-found: error

  windows:
    name: Windows package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(cat VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#v0.19.0

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      # WiX pinned to v5.0.2 like the taskly/termpilot release pipelines:
      # v7 gates builds behind the OSMF EULA acceptance (WIX7015). glaze
      # falls back to NSIS, then zip, by tool availability.
      - name: Install WiX (v5; the family MSI toolchain)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: App icon (ico from icon-512.png)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = [System.Drawing.Image]::FromFile("$PWD/assets/icon-512.png")
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.DrawImage($src, 0, 0, 256, 256)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [System.IO.File]::Create("$PWD/dist/Bitsmith.ico")
          $icon.Save($fs)
          $fs.Close()
          $g.Dispose(); $bmp.Dispose(); $src.Dispose()

      - name: Package
        shell: bash
        run: |
          # --installer runs glaze's native installer chain (WiX MSI,
          # falling back to NSIS/zip by tool availability — the test -f
          # gate below makes a silent degradation a hard failure).
          raco glaze build \
            --entry main.rkt \
            --name Bitsmith \
            --version "$VERSION" \
            --icon dist/Bitsmith.ico \
            --installer \
            --out dist
          # glaze emits Bitsmith.msi (no version in the name); rename
          # to the family asset form.
          test -f dist/Bitsmith.msi
          mv dist/Bitsmith.msi "bitsmith-$VERSION-windows-x64.msi"

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "bitsmith-$env:VERSION-windows-x64.zip"

      - name: Per-asset .sha256 sidecars
        shell: bash
        run: |
          sha256sum bitsmith-$VERSION-windows-x64.zip > bitsmith-$VERSION-windows-x64.zip.sha256
          sha256sum bitsmith-$VERSION-windows-x64.msi > bitsmith-$VERSION-windows-x64.msi.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            bitsmith-*-windows-x64.zip
            bitsmith-*-windows-x64.zip.sha256
            bitsmith-*-windows-x64.msi
            bitsmith-*-windows-x64.msi.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Signing the update feed needs the same racket the app ships with
      # (glaze/update schema structs + the crypto package's libcrypto FFI).
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze and crypto
        run: |
          raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#v0.19.0 crypto

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Canonical public asset set, verified before anything is uploaded:
      # the sixteen versioned payloads the build jobs produce (both Linux
      # architectures included). The per-asset .sha256 sidecars stay CI
      # artifacts — the unified SHA256SUMS is the published checksum
      # inventory (family convention).
      - name: Verify payload set and build SHA256SUMS
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p public
          for suffix in \
            linux-x64.tar.gz linux-x64.deb linux-x64.rpm linux-x64.AppImage linux-x64.flatpak \
            linux-arm64.tar.gz linux-arm64.deb linux-arm64.rpm linux-arm64.AppImage linux-arm64.flatpak \
            macos-arm64.dmg macos-arm64.zip \
            macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip; do
            name="bitsmith-$VERSION-$suffix"
            test -s "artifacts/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "artifacts/$name" public/
          done
          expected=16
          found="$(find public -maxdepth 1 -type f | wc -l)"
          test "$found" -eq "$expected" || { echo "::error::public/ holds $found files, expected $expected"; exit 1; }
          (cd public && sha256sum bitsmith-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq "$expected"

      # The signed update feed is a release asset (the app reads
      # releases/latest/download/update-manifest.json) whose signature the
      # embedded public key verifies. Fail-closed: no secret, no release.
      - name: Sign and require trusted update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == v* ]] || { echo "::error::release publishing requires a version tag"; exit 1; }
          [[ -n "${UPDATE_ED25519_PRIVATE_KEY:-}" ]] || {
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release"
            exit 1
          }
          umask 077
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$KEY_PEM"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          scripts/make-update-manifest.sh "$GITHUB_REF_NAME" artifacts "$KEY_PEM"
          test -s artifacts/update-manifest.json || {
            echo "::error::Signed update manifest missing; refusing to publish"
            exit 1
          }
          cp artifacts/update-manifest.json public/
          test "$(find public -maxdepth 1 -type f | wc -l)" -eq 18

      - name: Extract changelog section
        run: |
          # index() = fixed-string match; ver contains regex metachars ([)
          awk -v ver="## [$VERSION]" '
            index($0, ver) { seen=1; next }
            seen && /^## \[/ { exit }
            seen { print }' \
            CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md || { echo "::error::empty release notes"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release publishes as stable — no --prerelease, including
          # 0.x (family baseline: GitHub's "latest" release semantics only
          # count non-prerelease tags, and the update feed reads "latest").
          # Assets are listed explicitly — never a directory dump — so the
          # published set is exactly the verified public/ payload
          # (sixteen payloads + SHA256SUMS + the signed update manifest).
          gh release create "v$VERSION" \
            public/bitsmith-"$VERSION"-linux-x64.tar.gz \
            public/bitsmith-"$VERSION"-linux-x64.deb \
            public/bitsmith-"$VERSION"-linux-x64.rpm \
            public/bitsmith-"$VERSION"-linux-x64.AppImage \
            public/bitsmith-"$VERSION"-linux-x64.flatpak \
            public/bitsmith-"$VERSION"-linux-arm64.tar.gz \
            public/bitsmith-"$VERSION"-linux-arm64.deb \
            public/bitsmith-"$VERSION"-linux-arm64.rpm \
            public/bitsmith-"$VERSION"-linux-arm64.AppImage \
            public/bitsmith-"$VERSION"-linux-arm64.flatpak \
            public/bitsmith-"$VERSION"-macos-arm64.dmg \
            public/bitsmith-"$VERSION"-macos-arm64.zip \
            public/bitsmith-"$VERSION"-macos-x64.dmg \
            public/bitsmith-"$VERSION"-macos-x64.zip \
            public/bitsmith-"$VERSION"-windows-x64.msi \
            public/bitsmith-"$VERSION"-windows-x64.zip \
            public/SHA256SUMS \
            public/update-manifest.json \
            --title "Bitsmith v$VERSION" \
            --notes-file RELEASE-NOTES.md

      # Build provenance for the sixteen versioned payloads (the checksum
      # inventory and the signed feed describe the payloads; the payloads
      # are what gets attested).
      - name: Attest build provenance (16 versioned payloads)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/bitsmith-*
